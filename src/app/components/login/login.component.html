<app-about-start></app-about-start>
<div class="section-title text-center position-relative mb-4">
    <h6 class="d-inline-block position-relative text-secondary text-uppercase pb-2">Login</h6>
    <div class="contact-form">
        <form #formLogin="ngForm" (ngSubmit)="login()">
            <div class="row">
                <div class="col-6 form-group">
                    <input type="email"  name="email" class="form-control border-top-0 border-right-0 border-left-0 p-0"
                        placeholder="Email"  [(ngModel)]="user.email">
                </div>
                <div class="col-6 form-group">
                    <input type="password" name="password" class="form-control border-top-0 border-right-0 border-left-0 p-0"
                        placeholder="Password"  [(ngModel)]="user.password">
                </div>
            </div>

            <div>
                <button class="btn btn-primary py-3 px-5" type="submit">Login</button>
            </div>
        </form>
      
    </div>
      
</div>
  <div class=" text-center text-danger">{{this.errorMsg}}</div>
